<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Auto Sender Pro</title>
  <style>
    /* ── Design tokens ── */
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2e3248;
      --text:      #e8eaf0;
      --text-dim:  #8a90a8;
      --green:     #25d366;
      --green-dim: #1a9e4b;
      --amber:     #f59e0b;
      --red:       #ef4444;
      --blue:      #3b82f6;
      --radius:    10px;
      --font:      "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      width: 340px;
      min-height: 200px;
      padding: 0;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a2f1e 0%, #0f1a12 100%);
      border-bottom: 1px solid #1f3a24;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 32px; height: 32px;
      background: var(--green);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .header-text h1 {
      font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
      color: #e8f5e9;
    }
    .header-text p {
      font-size: 11px; color: #5d8a63; margin-top: 1px;
    }

    /* ── Badge (status pill) ── */
    #status-badge {
      margin-left: auto;
      font-size: 10px; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.05em;
      transition: background 0.3s, color 0.3s;
    }
    #status-badge.idle    { background: #1e2235; color: var(--text-dim); }
    #status-badge.running { background: #163020; color: var(--green);    }
    #status-badge.paused  { background: #2a2008; color: var(--amber);    }
    #status-badge.done    { background: #0f1e35; color: var(--blue);     }

    /* ── Tab nav ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      flex: 1; padding: 10px 0; text-align: center;
      font-size: 12px; font-weight: 600; color: var(--text-dim);
      cursor: pointer; border: none; background: none;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── Panels ── */
    .panel { display: none; padding: 14px 14px 10px; }
    .panel.active { display: block; }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 5px;
    }
    label span { font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; color: #4a5070; }

    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 9px 11px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus, input:focus, select:focus {
      border-color: var(--green-dim);
    }
    textarea::placeholder, input::placeholder { color: #3a3f58; }

    .field { margin-bottom: 12px; }

    /* ── Number meta row ── */
    .number-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 4px;
    }
    #num-count { font-size: 11px; color: var(--text-dim); }
    #num-invalid { font-size: 11px; color: var(--red); display: none; }

    /* ── Delay row ── */
    .delay-row { display: flex; gap: 8px; }
    .delay-row .field { flex: 1; }

    /* ── Char counter ── */
    #char-count { font-size: 11px; color: var(--text-dim); margin-top: 3px; text-align: right; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 6px; margin-top: 4px; }
    button {
      flex: 1; padding: 9px 6px;
      font-size: 12px; font-weight: 700;
      border: none; border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    button:hover:not(:disabled) { opacity: 0.88; }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #btn-start  { background: var(--green);  color: #fff; }
    #btn-pause  { background: var(--amber);  color: #fff; }
    #btn-resume { background: var(--blue);   color: #fff; }
    #btn-reset  { background: #2a2a3a;       color: var(--text-dim); }

    /* ── Progress ── */
    #progress-wrap {
      margin-top: 12px;
      background: var(--surface2);
      border-radius: 6px; height: 6px; overflow: hidden;
    }
    #progress-bar {
      background: linear-gradient(90deg, var(--green-dim), var(--green));
      height: 100%; width: 0%;
      transition: width 0.5s ease;
      border-radius: 6px;
    }

    /* ── Stats grid ── */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 6px; margin-top: 10px;
    }
    .stat-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      text-align: center;
    }
    .stat-card .val {
      font-size: 20px; font-weight: 800;
      line-height: 1;
    }
    .stat-card .lbl {
      font-size: 10px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-top: 3px;
    }
    .stat-card.green .val { color: var(--green); }
    .stat-card.red   .val { color: var(--red);   }
    .stat-card.dim   .val { color: var(--text-dim); }

    /* ── ETA / countdown ── */
    #timing-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px; font-size: 11px; color: var(--text-dim);
    }
    #countdown { color: var(--amber); font-weight: 600; }
    #eta { }

    /* ── Failed tab ── */
    #failed-list {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-height: 150px; overflow-y: auto;
      padding: 8px; font-size: 12px; color: var(--red);
      font-family: "Courier New", monospace;
      line-height: 1.8;
    }
    #failed-list:empty::before { content: "No failed numbers yet."; color: var(--text-dim); font-family: var(--font); font-size: 12px; }
    .failed-actions { display: flex; gap: 6px; margin-top: 8px; }
    .failed-actions button { font-size: 11px; padding: 6px 10px; flex: unset; }

    /* ── Empty state ── */
    .empty-note {
      text-align: center; color: var(--text-dim);
      font-size: 12px; padding: 20px 0;
    }

    /* ── Validation error ── */
    .error-msg {
      background: #2a0f0f; border: 1px solid #5a1a1a;
      color: #fc8181; border-radius: 8px;
      font-size: 12px; padding: 8px 11px;
      margin-top: 8px; display: none;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Footer ── */
    .legal-footer {
      text-align: center;
      font-size: 9px;
      color: var(--text-dim);
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      margin-top: auto;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- Tab navigation -->
  <div class="tabs" style="position:relative; padding-right:60px;">
    <button class="tab active" data-tab="compose">Compose</button>
    <button class="tab" data-tab="progress">Progress</button>
    <button class="tab" data-tab="failed">Failed</button>
    <div id="status-badge" class="idle" style="position:absolute; right:10px; top:10px;">Idle</div>
  </div>

  <!-- ── COMPOSE PANEL ── -->
  <div class="panel active" id="panel-compose">

    <div class="field">
      <label style="display:flex; justify-content:space-between; align-items:center;">
        <span>Phone Numbers <span>(one per line, with country code)</span></span>
        <button id="btn-import" style="padding:4px 8px; font-size:10px; width:auto; flex:none;">📥 Import</button>
      </label>
      <input type="file" id="file-import" accept=".txt,.csv" style="display:none" />
      <textarea id="numbers" rows="5" placeholder="919876543210&#10;14155552671&#10;447911123456"></textarea>
      <div class="number-meta">
        <span id="num-count">0 numbers</span>
        <span id="num-invalid"></span>
      </div>
    </div>

    <div class="field">
      <label>Message</label>
      <textarea id="message" rows="4" placeholder="Hello! This is an automated message from…"></textarea>
      <div id="char-count">0 characters</div>
    </div>

    <div class="delay-row">
      <div class="field">
        <label>Min Delay (sec)</label>
        <input type="number" id="delay-min" value="30" min="10" max="300" />
      </div>
      <div class="field">
        <label>Max Delay (sec)</label>
        <input type="number" id="delay-max" value="50" min="10" max="600" />
      </div>
    </div>

    <div id="compose-error" class="error-msg"></div>

    <div class="btn-row">
      <button id="btn-start">▶ Start</button>
      <button id="btn-pause"  disabled>⏸ Pause</button>
      <button id="btn-resume" disabled>↺ Resume</button>
      <button id="btn-reset">✕ Reset</button>
    </div>
  </div>

  <!-- ── PROGRESS PANEL ── -->
  <div class="panel" id="panel-progress">
    <div class="stats-grid">
      <div class="stat-card green">
        <div class="val" id="stat-sent">0</div>
        <div class="lbl">Sent</div>
      </div>
      <div class="stat-card red">
        <div class="val" id="stat-failed">0</div>
        <div class="lbl">Failed</div>
      </div>
      <div class="stat-card dim">
        <div class="val" id="stat-remaining">0</div>
        <div class="lbl">Left</div>
      </div>
    </div>

    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>

    <div id="timing-row">
      <span id="eta"></span>
      <span id="countdown"></span>
    </div>

    <div class="btn-row" style="margin-top:14px">
      <button id="btn-pause2"  disabled>⏸ Pause</button>
      <button id="btn-resume2" disabled>↺ Resume</button>
      <button id="btn-reset2">✕ Reset</button>
    </div>
    <div class="btn-row" style="margin-top:6px">
      <button id="btn-download-report" disabled style="background:#2a2a3a;color:var(--text-dim);">📊 Download Report</button>
    </div>
  </div>

  <!-- ── FAILED PANEL ── -->
  <div class="panel" id="panel-failed">
    <label>Numbers that failed after all retries</label>
    <div id="failed-list"></div>
    <div class="failed-actions">
      <button id="btn-copy-failed" style="background:#2a2a3a;color:var(--text-dim);">📋 Copy</button>
      <button id="btn-retry-failed" style="background:var(--amber);color:#fff;">↺ Retry Failed</button>
    </div>
  </div>

  <div class="legal-footer">
    For authorized business use only. Comply with WhatsApp's ToS. We are not responsible for account bans or misuse.
  </div>

  <script src="popup.js"></script>
</body>
</html>
